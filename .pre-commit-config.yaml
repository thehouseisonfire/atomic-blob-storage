repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false

      - id: markdown-links
        name: markdown links
        entry: python3 scripts/check-markdown-links.py
        language: system
        files: '(^|/).*\.md$|^scripts/check-markdown-links\.py$'
        pass_filenames: false

      - id: clippy
        name: clippy
        entry: >-
          bash -c 'set -euo pipefail;
          export RUSTFLAGS="-D warnings -W clippy::pedantic -W clippy::nursery";
          cargo clippy --all-targets -p atomic-blob-store --all-features --
          -D warnings -D clippy::multiple_crate_versions;
          RUSTFLAGS="-D warnings" cargo clippy --workspace --all-targets --all-features -- -D warnings'
        language: system
        pass_filenames: false
        require_serial: true

      - id: tests
        name: tests
        entry: >-
          bash -c 'set -euo pipefail;
          export RUSTFLAGS="-D warnings";
          cargo test --workspace --all-features;
          cargo test -p atomic-blob-store --no-default-features;
          cargo test -p atomic-blob-store --features tokio'
        language: system
        pass_filenames: false
        require_serial: true

      - id: package
        name: package validation
        entry: scripts/validate-atomic-blob-package.sh
        language: system
        pass_filenames: false
        require_serial: true
        stages: [manual]
