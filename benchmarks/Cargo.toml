[package]
name = "atomic-blob-store-benchmarks"
version = "0.1.0"
publish = false
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crc32c = "0.6"
rand = "0.10"
atomic_blob_store = { package = "atomic-blob-store", path = "..", features = ["bench-instrumentation", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "atomic-blob-store-bench"
path = "src/main.rs"
