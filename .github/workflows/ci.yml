name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked -p atomic-blob-store --no-default-features
      - run: cargo test --locked -p atomic-blob-store --features tokio
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - if: runner.os != 'Windows'
        run: |
          cargo doc --locked -p atomic-blob-store --no-deps
          cargo test --locked -p atomic-blob-store --doc
          cargo check --locked -p atomic-blob-store --examples
      - if: runner.os == 'Linux'
        run: |
          cargo run --locked -p atomic-blob-store-benchmarks --bin atomic-blob-store-bench -- \
            persistence envelope --samples 1 --operations-per-sample 1 --payload-size 16
          python3 scripts/check-markdown-links.py
          if rg -n -i 'rumqtt|mqtt|session|checkpoint' \
            src tests examples README.md FORMAT.md RELEASE.md CHANGELOG.md; then
            exit 1
          fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --locked -p atomic-blob-store --all-features
      - run: cargo check --locked -p atomic-blob-store --no-default-features --target wasm32-unknown-unknown
      - run: cargo check --locked -p atomic-blob-store --features tokio --target wasm32-unknown-unknown

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/validate-atomic-blob-package.sh
